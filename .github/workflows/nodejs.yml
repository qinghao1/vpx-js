name: Check

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Lint, typecheck, unit tests, and the harness legs that need no engine
    # artifact, VPX, ROM, or browser. The browser legs run in pages.yml
    # against the committed engine build (see verify:engine-manifest).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:esm
      - run: npm run verify:engine-manifest
      - run: npm run check
      - run: npm run verify:table
      - run: npm run verify:play-room

name: VPX Build Validation

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
        env:
          CI: true
      - run: npm run build:esm
        env:
          CI: true
      # lint + typecheck + typecheck:tests + test (see `npm run check`).
      - run: npm run check
        env:
          CI: true
      # Node-only verifies that pass with no GPU, no ROM, no native binary, and
      # no emscripten toolchain. Not verify-all: its optional legs only SKIP
      # without a VPX/ROM/engine artifact, and the browser leg needs Chrome.
      - run: npm run verify:table
        env:
          CI: true
      - run: npm run verify:play-room
        env:
          CI: true

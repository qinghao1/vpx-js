# Deploy the demo-browser to GitHub Pages (static hosting, no COOP/COEP).
#
# The threaded engine needs a cross-origin-isolated page, and Pages cannot send
# the COOP/COEP headers. VITE_COI_SW=1 makes the bundle ship a service worker
# (demo-browser/coi-sw.js) that adds them. Self-hosted builds send the headers
# from their server instead and omit the flag. The app is subpath-safe, so the
# same bundle works from a custom domain or a fork with another repo name.
#
# First deploy needs one manual step: Settings → Pages → Build and deployment →
# Source: GitHub Actions.

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo-browser/package-lock.json
      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - name: Submodule revisions for the wasm cache key
        id: sub
        run: |
          echo "vpinball=$(git rev-parse HEAD:external/vpinball)" >> "$GITHUB_OUTPUT"
      # Libs and their generated headers travel together: build-headless.sh
      # skips external.sh only when both are present. Exact key only — a
      # partial restore would mix libs from another submodule revision.
      - name: Cache third-party wasm libs
        uses: actions/cache@v4
        with:
          path: |
            external/vpinball/third-party/build-libs
            external/vpinball/third-party/include
          key: wasm-libs-${{ runner.os }}-emsdk-6.0.13-vp-${{ steps.sub.outputs.vpinball }}-${{ hashFiles('wasm/modules/headless/patches/*') }}
      - name: Install root dependencies
        run: npm ci
      - name: Build dist-esm
        run: npm run build:esm
      - name: Build headless engine
        run: wasm/build-headless.sh
      - name: Install demo dependencies
        run: npm ci
        working-directory: demo-browser
      - name: Build demo bundle (with the cross-origin isolation service worker)
        run: npm run build
        working-directory: demo-browser
        env:
          VITE_COI_SW: "1"
      - name: E2E on a static host (isolation via the service worker, engine boots)
        run: |
          touch demo-browser/dist/.nojekyll
          node test/harness/verify-pages.mjs --dist=demo-browser/dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-browser/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

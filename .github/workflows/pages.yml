# Deploy the demo-browser to GitHub Pages (static hosting, no COOP/COEP).
#
# The threaded engine needs a cross-origin-isolated page, and Pages cannot send
# the COOP/COEP headers. VITE_COI_SW=1 makes the bundle ship a service worker
# (demo-browser/coi-sw.js) that adds them. Self-hosted builds send the headers
# from their server instead and omit the flag. The app is subpath-safe, so the
# same bundle works from a custom domain or a fork with another repo name.
#
# First deploy needs one manual step: Settings → Pages → Build and deployment →
# Source: GitHub Actions.

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo-browser/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Build dist-esm
        run: npm run build:esm
      # The engine ships as a committed release build
      # (demo-browser/public/wasm/, with build-info.json provenance).
      # Rebuilding it on every deploy needs emsdk plus the submodule and is
      # slow and flaky, so CI verifies the manifest matches the tree instead —
      # a mismatch means the inputs changed without a local rebuild.
      # (Rationale lives in wasm/README.md.)
      - name: Verify committed engine manifest
        run: npm run verify:engine-manifest
      - name: Install demo dependencies
        run: npm ci
        working-directory: demo-browser
      - name: Build demo bundle (with the cross-origin isolation service worker)
        run: npm run build
        working-directory: demo-browser
        env:
          VITE_COI_SW: "1"
      - name: E2E on a static host (isolation via the service worker, engine boots)
        run: |
          touch demo-browser/dist/.nojekyll
          node test/harness/verify-pages.mjs --dist=demo-browser/dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-browser/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
